# Installed by deploy/install.sh with __PLACEHOLDERS__ filled in.

# --- TLS certificates from Let's Encrypt, managed by mod_md -------------------
# Until DNS points here, Apache serves a temporary self-signed certificate and
# mod_md keeps retrying. `systemctl reload apache2` retries immediately.
MDStoreDir __MD_STORE__
MDCertificateAgreement accepted
MDContactEmail __CONTACT_EMAIL__
MDomain __DOMAIN__
MDPrivateKeys secp256r1 rsa3072

SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLSessionTickets off
SSLUseStapling off

ServerTokens Prod
ServerSignature Off
TraceEnable off

<VirtualHost *:80>
    ServerName __DOMAIN__
    # mod_md answers ACME challenges before this redirect applies.
    Redirect permanent / https://__DOMAIN__/
</VirtualHost>

<VirtualHost *:443>
    ServerName https://__DOMAIN__:443
    UseCanonicalName On
    SSLEngine on
    Protocols h2 http/1.1
    Header always set Strict-Transport-Security "max-age=63072000"

    # Uploads are capped by the app's max_bot_upload_mb setting; this is a backstop.
    LimitRequestBody 1073741824
    Timeout 600

    # --- Shibboleth (Touchstone) ---------------------------------------------
    <Location /Shibboleth.sso>
        SetHandler shib
    </Location>
    Alias /shibboleth-sp/main.css /usr/share/shibboleth/main.css

    # Nobody but Apache may claim an identity: drop these from every request,
    # then set them only on the Shibboleth-protected login path.
    RequestHeader unset X-Remote-User early
    RequestHeader unset X-Display-Name early
    <Location /auth/touchstone>
        AuthType shibboleth
        ShibRequestSetting requireSession true
        ShibRequestSetting redirectToSSL 443
        Require shib-session
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
        RequestHeader set X-Display-Name "expr=%{reqenv:displayName}"
    </Location>

    # --- Static files straight from disk ---------------------------------------
    Alias /static/ __APP__/scrimmage/web/static/
    <Directory __APP__/scrimmage/web/static>
        Require all granted
        Options None
        # Pages link to static files with ?v=<commit>, so each deploy gets new URLs.
        Header set Cache-Control "public, max-age=604800"
    </Directory>

    # The worker API is only served on the internal port below.
    <Location /api/worker>
        Require all denied
    </Location>

    # --- Everything else goes to gunicorn ---------------------------------------
    ProxyPass /Shibboleth.sso !
    ProxyPass /shibboleth-sp !
    ProxyPass /static/ !
    ProxyPass / unix:/run/scrimmage/web.sock|http://localhost/ timeout=600
    ProxyPassReverse / unix:/run/scrimmage/web.sock|http://localhost/
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto https

    ErrorLog ${APACHE_LOG_DIR}/scrimmage-error.log
    CustomLog ${APACHE_LOG_DIR}/scrimmage-access.log combined
</VirtualHost>

# --- Internal port for match workers --------------------------------------------
# Reachable from this machine and, through the security group, only from fleet
# workers. Serves nothing but the worker API, which also requires the token.
Listen 8080
<VirtualHost *:8080>
    ServerName internal
    # Build uploads carry the built bot (up to 512 MiB)
    LimitRequestBody 671088640
    Timeout 600
    <Location />
        Require all denied
    </Location>
    <Location /api/worker/>
        Require ip 127.0.0.1 ::1 10.42.0.0/16
    </Location>
    ProxyPass /api/worker/ unix:/run/scrimmage/web.sock|http://localhost/api/worker/ timeout=600
    ErrorLog ${APACHE_LOG_DIR}/scrimmage-error.log
    CustomLog ${APACHE_LOG_DIR}/scrimmage-workers.log "%a %r %>s %b %Dus"
</VirtualHost>
